<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Serge Melis">
    <title>Open Universiteit - IM0403 Rule-Based Design - Individuele Opdracht</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta name="theme-color" content="#712cf9">
    <style>
    .container {
        max-width: 960px;
    }
    .standard {
        color: black;
    }
    .valid {
        color: green;
    }
    .warning {
        color: darkorange;
    }
    .danger {
        color: red;
    }
    .form-control,
    .form-control.is-invalid, .was-validated .form-control:invalid,
    .form-control.is-valid, .was-validated .form-control:valid {
        border:var(--bs-border-width) solid var(--bs-border-color);
        border-color: inherit;
        padding-right: calc(1.5em + .75rem);
        background-image: none;
    }
    nav {
      background: white;
      color: black;
    }
    nav div.container-fluid {
      padding: 10px 20px 10px 20px;
    }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <div class="container">
      <nav class="navbar navbar-light">
        <div class="container-fluid">
            <img src="./epfl.svg" alt=""  height="30" class="d-inline-block align-text-top"> EPFL - IT Equipment Management System
        </div>
      </nav>
      <br />
      <main>
        <div class="row g-5">
          <div class="col-md-6 col-lg-6 order-md-last">
            <h4 class="d-flex justify-content-between align-items-center mb-3">
              <span class="text-primary">Rules checked</span>
              <span class="badge bg-primary rounded-pill" id="numberOfRules">0</span>
            </h4>
            <ul class="list-group mb-3" id="rules"></ul>
            <hr class="my-4">
            <div class="col-sm-12">
              <label for="log" class="form-label">Log</label>
              <div class="form-control col-xs-12" id="log"></div>
            </div>
          </div>
          <div class="col-md-6 col-lg-6">
            <h4 class="mb-3">Equipment Transfer</h4>
            <div id="messages"></div>
            <form class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-12">
                  <label for="ITEquipment" class="form-label">IT Equipment</label>
                  <input type="text" class="form-control" id="ITEquipment" placeholder="" value='MacBook Air 13" (CH20225011)' required>
                  <div class="invalid-feedback">IT Equipment Identifier is required.</div>
                </div>
                <div class="col-sm-6">
                  <label for="InventoryValue" class="form-label">Inventory Value (CHF)</label>
                  <input type="text" class="form-control" id="InventoryValue" placeholder="" value="500" required>
                </div>
                <div class="col-sm-6">
                  <label for="ResalePrice" class="form-label">Resale Price (CHF)</label>
                  <input type="text" class="form-control" id="ResalePrice" placeholder="" value="">
                </div>
              </div>
              <hr class="my-4">
              <button class="w-100 btn btn-primary btn-lg" type="submit">Create Equipment Transfer</button>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./rules.js"></script>
  </body>
</html>
