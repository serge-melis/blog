<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Serge Melis">
    <title>Open Universiteit - IM0403 Rule-Based Design - Individuele Opdracht</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
     <meta name="theme-color" content="#712cf9">
    <style>
    .container {
        max-width: 960px;
    }
    .standard {
        color: black;
    }
    .valid {
        color: green;
    }
    .error {
        color: red;
    }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <div class="container">
      <main>
        <div class="py-5 text-center">
          <img class="d-block mx-auto mb-4" src="./epfl.svg" alt="" width="272" height="79">
          <h2>Equipment Transfer form</h2>
          <p class="lead">Below is an example form showing the proposed interaction for the IT Service Desk.</p>
        </div>

        <div class="row g-5">
          <div class="col-md-5 col-lg-4 order-md-last">
            <h4 class="d-flex justify-content-between align-items-center mb-3">
              <span class="text-primary">Rules</span>
              <span class="badge bg-primary rounded-pill" id="numberOfRules">0</span>
            </h4>
            <ul class="list-group mb-3" id="rules"></ul>
          </div>

          <div class="col-md-7 col-lg-8">
            <h4 class="mb-3">Equipment Transfer</h4>
            <form class="needs-validation" novalidate>
              <div class="row g-3">

                <div class="col-12">
                  <label for="ITEquipment" class="form-label">IT Equipment</label>
                  <input type="text" class="form-control" id="ITEquipment" placeholder="" value='MacBook Air 13" (CH20225011)' required>
                  <div class="invalid-feedback">IT Equipment Identifier is required.</div>
                </div>

                <div class="col-sm-6">
                  <label for="InventoryValue" class="form-label">Inventory Value (CHF)</label>
                  <input type="text" class="form-control" id="InventoryValue" placeholder="" value="500" required>
                  <div class="invalid-feedback">Inventory Value is required.</div>
                </div>

                <div class="col-sm-6">
                  <label for="ResalePrice" class="form-label">Resale Price (CHF)</label>
                  <input type="text" class="form-control" id="ResalePrice" required placeholder="" value="">
                  <div class="invalid-feedback">May not exceed Inventory Value</div>
                </div>

              </div>

              <hr class="my-4">
              <button class="w-100 btn btn-primary btn-lg" type="submit">Create Equipment Transfer</button>

              <hr class="my-4">
              <div class="col-sm-12">
                  <label for="log" class="form-label">Log</label>
                  <div class="form-control col-xs-12" id="log"></div>
              </div>

            </form>
          </div>
        </div>
      </main>

            <footer class="my-5 pt-5 text-body-secondary text-center text-small">
                <p class="mb-1">&copy; 2025 &mdash; Groep 2</p>
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script>

        let rules = [];
        /* RuleID : {startConcept, verbConcept, endConcept, message} */
        rules[0] = {'name':'RBD-4.3','startConcept':'ResalePrice','verbConcept':doesNotExceed,'endConcept':'InventoryValue','message':'Resale Price may not exceed Inventory Value'};

        function doesNotExceed(startConcept, endConcept) {
            const startConceptValue = parseInt(document.getElementById(startConcept).value, 0);
            const endConceptValue = parseInt(document.getElementById(endConcept).value, 0);
            return !(startConceptValue > endConceptValue);
        }

        const logText = document.getElementById('log');
        function log(message, status) {
            logText.insertAdjacentHTML('beforeend', `<div class="${status}">${message}</div>`);
        }

        function evaluateRules(rules) {
            let allRulesAreValid = true;
            rules.forEach(rule => {
                let ruleIsNotViolated = rule.verbConcept(rule.startConcept, rule.endConcept);
                log(
                    'Evaluating: '+rule.name +': ' + rule.startConcept + ' ' + rule.verbConcept.name + ' ' + rule.endConcept
                     + (ruleIsNotViolated ? ' (Valid)' : ' (Fail) <br>'+rule.message),
                     (ruleIsNotViolated) ? 'valid' : 'error');
                document.getElementById(rule.startConcept).classList.remove(['is-valid','is-invalid']);
                document.getElementById(rule.startConcept).classList.add((ruleIsNotViolated) ? 'is-valid' : 'is-invalid');

                allRulesAreValid = allRulesAreValid && ruleIsNotViolated;
            });
            return allRulesAreValid;
        }

        function listRules(rules) {
            // list the configured rules
            const rulesList = document.getElementById('rules');
            const numberOfRules = document.getElementById('numberOfRules');
            numberOfRules.innerText = rules.length;
            while (rulesList.children.length > 0) {rulesList.removeChild(rulesList.children[0])};
            rules.forEach(rule => {
                rulesList.insertAdjacentHTML('beforeend',`
                <li class="list-group-item d-flex justify-content-between lh-sm">
                    <div>
                      <h6 class="my-0">${rule.name}</h6>
                      <small class="text-body-secondary">${rule.message}</small>
                    </div>
                    <span class="text-body-secondary"></span>
                  </li>`);
            });
        }

        (() => {
            'use strict'

            listRules(rules);

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll('.needs-validation');

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    let isValid = form.checkValidity();
                    isValid = isValid && evaluateRules(rules);
                    //if (!isValid) {
                        event.preventDefault()
                        event.stopPropagation()
                    //};

                form.classList.add('was-validated')
                }, false)
            })

        })()
        </script>
    </body>
</html>
